    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-medium transition transform translate-y-20 opacity-0 z-50 flex items-center space-x-2">
        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMsg">복사되었습니다.</span>
    </div>

    <script>
        // App State
        let currentStep = 1;
        let selectedGender = { my: 'female', target: 'male' };
        let selectedStyle = 'balance';
        let apiKey = localStorage.getItem('fight_gemini_api_key') || '';
        let generatedResultText = '';

        window.onload = function() {
            lucide.createIcons();
            if (apiKey) {
                document.getElementById('userApiKey').value = apiKey;
                document.getElementById('apiStatusText').innerText = 'API 연동됨';
                document.getElementById('apiStatusText').classList.add('text-indigo-600');
            }
        };

        function toggleApiModal() {
            const modal = document.getElementById('apiModal');
            modal.classList.toggle('hidden');
        }

        function saveApiKey() {
            const val = document.getElementById('userApiKey').value.trim();
            apiKey = val;
            if (val) {
                localStorage.setItem('fight_gemini_api_key', val);
                document.getElementById('apiStatusText').innerText = 'API 연동됨';
                showToast('API 키가 저장되었습니다.');
            } else {
                localStorage.removeItem('fight_gemini_api_key');
                document.getElementById('apiStatusText').innerText = 'Gemini API 키 연동';
                showToast('API 키가 제거되었습니다. 시뮬레이션 모드로 작동합니다.');
            }
            toggleApiModal();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function updateIntimacyText(val) {
            const label = document.getElementById('intimacyLabel');
            const map = {
                '1': 'Lv 1. 어색하거나 서먹한 사이 / 비즈니스',
                '2': 'Lv 2. 가끔 연락하는 평범한 아는 사이',
                '3': 'Lv 3. 자주 만나는 친한 사이',
                '4': 'Lv 4. 매우 깊은 관계 (비밀 공유)',
                '5': 'Lv 5. 최측근 (가족/연인/대체 불가능한 절친)'
            };
            label.innerText = map[val];
        }

        function selectGender(type, gender) {
            selectedGender[type] = gender;
            ['male', 'female', 'none'].forEach(g => {
                const btn = document.getElementById(`${type}Gender_${g}`);
                if (g === gender) {
                    btn.className = 'gender-btn py-2 border border-indigo-600 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-semibold transition';
                } else {
                    btn.className = 'gender-btn py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition';
                }
            });
        }

        function updateStyleSelection(style) {
            selectedStyle = style;
            ['balance', 'T', 'F'].forEach(s => {
                const card = document.getElementById(`styleCard_${s}`);
                if (s === style) {
                    card.className = 'style-card cursor-pointer border-2 border-indigo-600 bg-indigo-50/50 p-3.5 rounded-xl transition text-left relative flex flex-col justify-between';
                } else {
                    card.className = 'style-card cursor-pointer border-2 border-slate-200 p-3.5 rounded-xl hover:border-slate-300 transition text-left relative flex flex-col justify-between';
                }
            });
        }

        function goToStep(step) {
            // Validation for Step 1
            if (step === 2 && currentStep === 1) {
                const who = document.getElementById('inputWho').value.trim();
                const what = document.getElementById('inputWhat').value.trim();
                if (!who || !what) {
                    showToast('누가(Who) 및 무엇을(What) 항목은 필수 작성 사항입니다.');
                    return;
                }
            }

            currentStep = step;
            
            // Toggle Views
            document.getElementById('step1').classList.toggle('hidden', step !== 1);
            document.getElementById('step2').classList.toggle('hidden', step !== 2);
            document.getElementById('step3').classList.toggle('hidden', step !== 3);

            // Update Header Progress
            const progressLine = document.getElementById('progressLine');
            progressLine.style.width = step === 1 ? '0%' : step === 2 ? '50%' : '100%';

            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`stepDot${i}`);
                const label = document.getElementById(`stepLabel${i}`);
                
                if (i < step) {
                    dot.className = 'w-8 h-8 rounded-full bg-emerald-500 text-white font-semibold flex items-center justify-center text-sm transition';
                    dot.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>';
                    label.className = 'text-xs font-semibold text-emerald-600 mt-1.5';
                } else if (i === step) {
                    dot.className = 'w-8 h-8 rounded-full border-2 border-indigo-600 bg-indigo-600 text-white font-semibold flex items-center justify-center text-sm transition';
                    dot.innerText = i;
                    label.className = 'text-xs font-semibold text-indigo-600 mt-1.5';
                } else {
                    dot.className = 'w-8 h-8 rounded-full border-2 border-slate-300 bg-white text-slate-400 font-semibold flex items-center justify-center text-sm transition';
                    dot.innerText = i;
                    label.className = 'text-xs font-medium text-slate-400 mt-1.5';
                }
            }
            lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetApp() {
            document.getElementById('inputWho').value = '';
            document.getElementById('inputWhen').value = '';
            document.getElementById('inputWhere').value = '';
            document.getElementById('inputWhat').value = '';
            document.getElementById('inputHow').value = '';
            document.getElementById('inputWhy').value = '';
            goToStep(1);
        }

        async function generateSolution() {
            goToStep(3);
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultState').classList.add('hidden');

            const data = {
                who: document.getElementById('inputWho').value.trim(),
                when: document.getElementById('inputWhen').value.trim() || '최근',
                where: document.getElementById('inputWhere').value.trim() || '일상적 공간',
                what: document.getElementById('inputWhat').value.trim(),
                how: document.getElementById('inputHow').value.trim() || '감정적 마찰 발생',
                why: document.getElementById('inputWhy').value.trim() || '서로 간 오해 및 소통 부재',
                intimacy: document.getElementById('intimacySlider').value,
                myGender: selectedGender.my,
                targetGender: selectedGender.target,
                style: selectedStyle
            };

            if (apiKey) {
                try {
                    await fetchGeminiSolution(data);
                } catch (e) {
                    console.error("Gemini API Error, falling back to smart simulation:", e);
                    renderSmartSimulationSolution(data);
                }
            } else {
                // Realistic delay for analysis feel
                setTimeout(() => {
                    renderSmartSimulationSolution(data);
                }, 1200);
            }
        }

        // Gemini API Real Call with structured JSON prompt
        async function fetchGeminiSolution(data) {
            const systemPrompt = `너는 대한민국 최고의 갈등 해결 심리 전문가이자 소통 컨설턴트다. 
사용자가 작성한 육하원칙(Who, When, Where, What, How, Why)을 정밀하게 분석하여, 흔해 빠진 추상적 조언(Do/Don't)이 아닌 **사용자가 입력한 실제 문장과 단어, 상황 정황을 직접 인용**하고 이에 맞춘 정밀 4단계 해결 솔루션을 제안하라.

결과는 반드시 JSON 포맷으로 작성하라:
{
  "analysisTitle": "상황 및 방어기제 분석 요약 제목 (한 문장)",
  "psychologyText": "입력된 상황(무엇을, 왜, 어떻게)을 토대로 상대방이 왜 그런 태도를 보였는지 심리 기제 및 오해 가능성 분석 (3-4문장)",
  "solutionSteps": [
    {
      "step": 1,
      "title": "1단계: 감정 환기 및 접촉 타이밍",
      "action": "사용자가 입력한 '어디서/언제/어떻게' 항목을 기반으로 한 구체적인 행동 지침",
      "rationale": "왜 이 접근이 효과적인지 입력 내용 인용 설명"
    },
    {
      "step": 2,
      "title": "2단계: 갈등 핵심 지점(What/Why)에 대한 직접 대화 앵커링",
      "action": "사용자가 서운해하는 핵심 원인(Why)을 지적하되 상대 방어기제를 허물 구체적 대화 주안점",
      "rationale": "대화 방식 설명"
    },
    {
      "step": 3,
      "title": "3단계: 재발 방지 규칙 구축",
      "action": "동일 상황 예방을 위해 사용자와 상대방이 합의해야 할 실제 행동 규범",
      "rationale": "관계 지속 관점의 설명"
    },
    {
      "step": 4,
      "title": "4단계: 관계 회복 및 관계 격상",
      "action": "친밀도 레벨과 성향을 고려한 마무리 스탠스",
      "rationale": "안정화 설명"
    }
  ],
  "cautionPoints": [
    "사용자가 감정적으로 실수하기 쉬운 구체적 금지 행동 1 (입력문장 연계)",
    "상황 악화를 초래할 수 있는 반응 방식 2",
    "경계해야 할 오판 3"
  ]
}`;

            const userPrompt = `
- 대상(Who): ${data.who}
- 시점(When): ${data.when}
- 장소/채널(Where): ${data.where}
- 사건(What): ${data.what}
- 당시 상황/반응(How): ${data.how}
- 갈등 심화 원인(Why): ${data.why}
- 친밀도 레벨: 5단계 중 ${data.intimacy}단계
- 내 성별: ${data.myGender}, 상대 성별: ${data.targetGender}
- 원하는 솔루션 성향: ${data.style} (balance: 밸런스, T: 현실팩트/문제해결, F: 공감/관계보호)`;

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
                const parsed = JSON.parse(text);
                renderSolutionUI(parsed);
            } else {
                throw new Error("Invalid API Response");
            }
        }

        // Local Simulation Engine with high relevance parsing
        function renderSmartSimulationSolution(data) {
            const intimacyDesc = data.intimacy >= 4 ? '깊은 신뢰 관계' : data.intimacy <= 2 ? '아직 격식이 필요한 사이' : '상호 신뢰가 형성되어 가는 관계';
            
            let styleFocus = '';
            if (data.style === 'T') {
                styleFocus = '감정적 소모를 최소화하고, 문제의 재발 방지 및 합리적 타협안 마련에 집중합니다.';
            } else if (data.style === 'F') {
                styleFocus = '서로가 받은 감정적 상처를 보듬고, 관계의 끈을 유연하게 지키는 데 집중합니다.';
            } else {
                styleFocus = '명확한 사실관계 정리와 서운했던 감정의 경청을 균형 있게 배치합니다.';
            }

            const mockResult = {
                analysisTitle: `"${data.who}"과의 [${data.what.slice(0, 18)}...] 갈등 정밀 재구성`,
                psychologyText: `입력하신 내용에 따르면, 상대방은 '${data.how.slice(0, 25)}...' 과정에서 자신의 과실이나 방어기제가 자극받았을 가능성이 높습니다. 특히 '${data.why.slice(0, 30)}...'라고 느끼신 부분은 상대방 역시 자신의 자존심이나 미안함을 거칠게 표현하는 과정에서 발생한 오해일 수 있습니다. 현재 상대방은 미안함과 불편함이 섞인 채 대화의 주도권을 잃지 않으려는 심리적 자아방어를 가동 중입니다. (${intimacyDesc}임을 감안한 맞춤 접근 필요)`,
                solutionSteps: [
                    {
                        step: 1,
                        title: "1단계: 자극 최소화 및 대화 물꼬 터놓기 (Timing & Channel)",
                        action: `'${data.where}'에서 발생한 갈등의 감정적 과열을 식히기 위해, 감정이 섞인 직설적 따짐 대신 단순 확인식 질문으로 접촉하십시오.`,
                        rationale: `'${data.when}' 당시의 과열된 감정 상태에서 바로 본론을 꺼내면 다시 '${data.how}'와 같은 방어적 태도가 재현될 수 있습니다.`
                    },
                    {
                        step: 2,
                        title: "2단계: 핵심 서운함 원인(Why)에 대한 'I-Message' 전달",
                        action: `'${data.what}' 자체를 비난하기보다, "네가 ~했을 때, 나는 '${data.why.slice(0, 20)}...'라고 느껴서 속상했어"라는 형식으로 내 감정의 사실만을 전달하십시오.`,
                        rationale: `상대방이 '${data.how}'처럼 반발한 것은 자신 전체가 공격받는다고 느꼈기 때문입니다. 행동과 내 감정을 분리해 전달하면 방어벽이 허물어집니다.`
                    },
                    {
                        step: 3,
                        title: "3단계: 구체적인 행동 재발 방지 합의 (Action Plan)",
                        action: `향후 비슷한 상황이 재발하지 않도록, 예를 들어 "다음부터 상황이 생기면 서로 최소 10분 전에 알려주기"와 같이 구체적이고 이행 가능한 규칙 1가지를 명확히 요구하십시오.`,
                        rationale: `${styleFocus} 단순히 "앞으로 잘하자"는 말은 또 다시 구체적 상황에서 동일한 마찰을 일으킵니다.`
                    },
                    {
                        step: 4,
                        title: "4단계: 관계 정상화 및 안정적 마무리",
                        action: `대화 후 상대가 미안함을 표시하거나 타협안을 수용하면, 과거 일을 다시 꺼내지 않고 평소의 편안한 대화 주제나 공동의 관심사로 자연스럽게 전환하십시오.`,
                        rationale: `${data.intimacy}단계 친밀도를 고려했을 때, 서운함을 풀고 난 뒤의 빠른 일상 복귀가 상대의 부끄러움을 덜어주고 관계를 매끄럽게 해줍니다.`
                    }
                ],
                cautionPoints: [
                    `상대방의 '${data.how}' 반응에 똑같이 감정적으로 격앙되어 SNS나 주변 사람에게 상황을 공론화하는 행동`,
                    `'${data.why.slice(0, 15)}...'의 감정이 해소되지 않았다고 해서 과거의 다른 잘잘못까지 끌어올려 비난 범위를 넓히는 것`,
                    `상대가 미안함을 은연중에 표명했을 때 자존심을 세우기 위해 즉각 받아주지 않고 찬바람을 피우는 태도`
                ]
            };

            renderSolutionUI(mockResult);
        }

        function renderSolutionUI(result) {
            document.getElementById('analysisTitle').innerText = result.analysisTitle;
            document.getElementById('psychologyText').innerText = result.psychologyText;

            // Render 4 Steps
            const stepsContainer = document.getElementById('solutionStepsContainer');
            stepsContainer.innerHTML = '';

            result.solutionSteps.forEach((s) => {
                const item = document.createElement('div');
                item.className = 'bg-slate-50 border border-slate-200/80 rounded-xl p-4 sm:p-5 space-y-2 transition hover:border-indigo-200';
                item.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-6 h-6 rounded-full bg-indigo-600 text-white text-xs font-bold flex items-center justify-center shrink-0">${s.step}</span>
                        <h4 class="text-sm font-bold text-slate-900">${s.title}</h4>
                    </div>
                    <div class="pl-8 space-y-1">
                        <p class="text-xs sm:text-sm text-slate-800 font-medium leading-relaxed">${s.action}</p>
                        <p class="text-[11px] sm:text-xs text-indigo-600/90 font-normal">💡 근거: ${s.rationale}</p>
                    </div>
                `;
                stepsContainer.appendChild(item);
            });

            // Render Caution Points
            const cautionContainer = document.getElementById('cautionContainer');
            cautionContainer.innerHTML = '';
            result.cautionPoints.forEach((c) => {
                const li = document.createElement('li');
                li.innerText = c;
                cautionContainer.appendChild(li);
            });

            // Save Plain Text for Full Copy
            generatedResultText = `[fight 갈등 해결 맞춤 솔루션 Report]

■ 분석 요약: ${result.analysisTitle}
${result.psychologyText}

■ 맞춤형 4단계 실행 솔루션
${result.solutionSteps.map(s => `${s.step}단계. ${s.title}\n - 실행: ${s.action}\n - 근거: ${s.rationale}`).join('\n\n')}

■ 핵심 리스크 및 주의사항
${result.cautionPoints.map(c => `- ${c}`).join('\n')}
`;

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('resultState').classList.remove('hidden');
            lucide.createIcons();
        }

        function copyFullResult() {
            if (!generatedResultText) return;
            
            // Clipboard Fallback Strategy
            const textarea = document.createElement('textarea');
            textarea.value = generatedResultText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('전체 솔루션 결과가 클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('복사에 실패했습니다. 수동 선택 복사를 이용해 주세요.');
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
