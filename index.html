<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fight - 맞춤형 갈등 해결 AI 솔루션</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px; width: 22px; border-radius: 50%;
      background: #6366f1; cursor: pointer;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white font-black text-xl shadow-md">f</div>
        <span class="font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600">fight</span>
      </div>
      <button onclick="toggleApiModal()" class="text-xs text-slate-500 hover:text-indigo-600 font-medium border border-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
        <i class="fa-solid fa-key text-indigo-500"></i> API 키 설정
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-8">
    <!-- Progress Bar -->
    <div class="mb-8 glass-card p-4 rounded-2xl shadow-sm">
      <div class="flex justify-between text-xs font-semibold text-slate-500 mb-2">
        <span id="step1-label" class="text-indigo-600">1. 상황 입력 (5W1H)</span>
        <span id="step2-label">2. 조건 & 스타일</span>
        <span id="step3-label">3. 심층 솔루션</span>
      </div>
      <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-1/3 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Step 1 -->
    <section id="step-1" class="glass-card p-6 md:p-8 rounded-3xl shadow-sm space-y-6">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">1단계: 다툼 상황 정리 (육하원칙)</h2>
        <p class="text-slate-500 text-sm mt-1">상황을 육하원칙에 맞게 입력해주시면 AI가 세밀하게 분석합니다.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Who (누가)</label>
          <input type="text" id="who" placeholder="예: 3년 지기 절친 친구가, 동아리 부원이" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">When (언제)</label>
          <input type="text" id="when" placeholder="예: 어제 저녁 약속 장소에서" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Where (어디서)</label>
          <input type="text" id="where" placeholder="예: 카페에서 이야기하던 중" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">What (무엇을)</label>
          <input type="text" id="what" placeholder="예: 약속 시간에 1시간 늦은 문제로 다툽" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">How (어떻게 - 갈등 전개 과정)</label>
        <textarea id="how" rows="3" placeholder="예: 내가 왜 늦었냐고 따지자 친구가 사과 없이 오히려 왜 짜증내냐며 화를 내고 먼저 자리를 뜸" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Why (왜 - 다툼이 커진 감정/이유)</label>
        <textarea id="why" rows="2" placeholder="예: 평소에도 자주 늦는데 미안한 기색이 전혀 없어서 그동안 참았던 감정이 터짐" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>

      <button onclick="goToStep(2)" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition">
        다음 단계로 이동 <i class="fa-solid fa-arrow-right ml-2"></i>
      </button>
    </section>

    <!-- Step 2 -->
    <section id="step-2" class="glass-card p-6 md:p-8 rounded-3xl shadow-sm space-y-6 hidden">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">2단계: 관계 및 원하는 스타일 선택</h2>
        <p class="text-slate-500 text-sm mt-1">상대와의 관계와 원하는 솔루션 톤을 선택해주세요.</p>
      </div>

      <!-- Intimacy Slider -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-slate-700">상대와의 친밀도</label>
          <span id="intimacy-text" class="text-xs font-bold text-indigo-600">3단계: 친한 사이</span>
        </div>
        <input type="range" id="intimacy" min="1" max="5" value="3" oninput="updateIntimacyText(this.value)" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
      </div>

      <!-- Gender -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">내 성별</label>
          <select id="my-gender" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="남성">남성</option>
            <option value="여성">여성</option>
            <option value="선택 안 함">선택 안 함</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">상대방 성별</label>
          <select id="other-gender" class="w-full text-sm p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="남성">남성</option>
            <option value="여성">여성</option>
            <option value="선택 안 함">선택 안 함</option>
          </select>
        </div>
      </div>

      <!-- Advice Tone -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-2">원하는 조언 스타일</label>
        <div class="grid grid-cols-3 gap-3">
          <button type="button" onclick="selectTone('T')" id="tone-T" class="tone-btn border-2 border-indigo-600 bg-indigo-50 text-indigo-900 p-3 rounded-2xl text-center transition">
            <div class="font-bold text-sm">🧠 T 스타일</div>
            <div class="text-[11px] text-slate-500 mt-1">현실 솔루션 & 팩트 분석</div>
          </button>
          <button type="button" onclick="selectTone('F')" id="tone-F" class="tone-btn border-2 border-slate-200 p-3 rounded-2xl text-center transition">
            <div class="font-bold text-sm">💖 F 스타일</div>
            <div class="text-[11px] text-slate-500 mt-1">공감·위로 & 감정 케어</div>
          </button>
          <button type="button" onclick="selectTone('B')" id="tone-B" class="tone-btn border-2 border-slate-200 p-3 rounded-2xl text-center transition">
            <div class="font-bold text-sm">⚖️ 밸런스형</div>
            <div class="text-[11px] text-slate-500 mt-1">논리와 공감의 조화</div>
          </button>
        </div>
      </div>

      <div class="flex gap-3">
        <button onclick="goToStep(1)" class="w-1/3 py-4 border border-slate-200 text-slate-600 font-bold rounded-2xl hover:bg-slate-100 transition">이전</button>
        <button onclick="generateSolution()" class="w-2/3 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition">맞춤 솔루션 생성 <i class="fa-solid fa-wand-magic-sparkles ml-1"></i></button>
      </div>
    </section>

    <!-- Step 3 -->
    <section id="step-3" class="glass-card p-6 md:p-8 rounded-3xl shadow-sm space-y-6 hidden">
      <div class="flex justify-between items-start">
        <div>
          <h2 class="text-2xl font-bold text-slate-900">3단계: 맞춤 심층 솔루션</h2>
          <p class="text-slate-500 text-sm mt-1">입력해주신 상황을 심층 분석한 결과입니다.</p>
        </div>
        <button onclick="copyResults()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1">
          <i class="fa-regular fa-copy"></i> 전체 복사
        </button>
      </div>

      <div id="loading" class="py-12 text-center space-y-3">
        <div class="inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm font-medium text-slate-600">상황 맥락을 깊이 분석하고 있습니다...</p>
      </div>

      <div id="solution-content" class="space-y-6 hidden">
        <!-- Fact & Psychology -->
        <div class="bg-indigo-50/60 border border-indigo-100 p-5 rounded-2xl space-y-3">
          <h3 class="font-bold text-indigo-950 flex items-center gap-2 text-base">
            <i class="fa-solid fa-magnifying-glass-chart text-indigo-600"></i> 상황 요약 & 상대방 심리 분석
          </h3>
          <p id="res-summary" class="text-sm text-slate-700 leading-relaxed"></p>
        </div>

        <!-- 4 Steps -->
        <div class="space-y-3">
          <h3 class="font-bold text-slate-900 flex items-center gap-2 text-base">
            <i class="fa-solid fa-list-check text-indigo-600"></i> 맥락 밀착 4단계 대처 솔루션
          </h3>
          <div id="res-steps" class="space-y-3"></div>
        </div>

        <!-- Risks & Warnings -->
        <div class="bg-rose-50/60 border border-rose-100 p-5 rounded-2xl space-y-2">
          <h3 class="font-bold text-rose-950 flex items-center gap-2 text-base">
            <i class="fa-solid fa-triangle-exclamation text-rose-500"></i> 주의해야 할 리스크 (절대 하지 말아야 할 것)
          </h3>
          <p id="res-risks" class="text-sm text-slate-700 leading-relaxed"></p>
        </div>

        <button onclick="resetAll()" class="w-full py-4 border border-slate-300 text-slate-700 font-bold rounded-2xl hover:bg-slate-100 transition">
          <i class="fa-solid fa-rotate-left mr-2"></i> 처음부터 다시 하기
        </button>
      </div>
    </section>
  </main>

  <script>
    let selectedTone = 'T';
    let apiKey = localStorage.getItem('fight_gemini_key') || '';

    function toggleApiModal() {
      const key = prompt('Gemini API 키를 입력하세요 (미입력 시 모의 솔루션 제공):', apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('fight_gemini_key', apiKey);
        alert(apiKey ? 'API 키가 저장되었습니다.' : 'API 키가 삭제되었습니다.');
      }
    }

    function updateIntimacyText(val) {
      const texts = ['1단계: 어색한 사이', '2단계: 아는 사이', '3단계: 친한 사이', '4단계: 매우 친한 사이', '5단계: 절친/가족 사이'];
      document.getElementById('intimacy-text').innerText = texts[val - 1];
    }

    function selectTone(tone) {
      selectedTone = tone;
      ['T', 'F', 'B'].forEach(t => {
        const btn = document.getElementById(`tone-${t}`);
        if (t === tone) {
          btn.className = 'tone-btn border-2 border-indigo-600 bg-indigo-50 text-indigo-900 p-3 rounded-2xl text-center transition';
        } else {
          btn.className = 'tone-btn border-2 border-slate-200 p-3 rounded-2xl text-center transition';
        }
      });
    }

    function goToStep(step) {
      [1, 2, 3].forEach(s => {
        document.getElementById(`step-${s}`).classList.add('hidden');
        document.getElementById(`step${s}-label`).className = s === step ? 'text-indigo-600 font-bold' : '';
      });
      document.getElementById(`step-${step}`).classList.remove('hidden');
      document.getElementById('progress-bar').style.width = (step / 3 * 100) + '%';
    }

    async function generateSolution() {
      goToStep(3);
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('solution-content').classList.add('hidden');

      const data = {
        who: document.getElementById('who').value || '상대방',
        when: document.getElementById('when').value || '최근',
        where: document.getElementById('where').value || '장소',
        what: document.getElementById('what').value || '다툼',
        how: document.getElementById('how').value || '말다툼 전개',
        why: document.getElementById('why').value || '감정 대립',
        intimacy: document.getElementById('intimacy-text').innerText,
        myGender: document.getElementById('my-gender').value,
        otherGender: document.getElementById('other-gender').value,
        tone: selectedTone === 'T' ? '현실적 팩트 폭격 T 스타일' : selectedTone === 'F' ? '따뜻한 감정 위로 F 스타일' : '밸런스형'
      };

      if (apiKey) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: `갈등 분석 컨설턴트로서 아래 상황을 바탕으로 JSON 형식으로 출력해라.
JSON 키: summary(상황 및 상대 심리 요약), step1, step2, step3, step4(구체적 4단계 솔루션), risks(주의해야할 리스크)

상황: ${JSON.stringify(data)}` }]
              }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const jsonRes = await res.json();
          const parsed = JSON.parse(jsonRes.candidates[0].content.parts[0].text);
          renderResults(parsed);
          return;
        } catch (e) {
          console.error(e);
        }
      }

      // Default fallback
      setTimeout(() => {
        renderResults({
          summary: `${data.who}과의 관계(${data.intimacy})에서 발생한 '${data.what}' 문제는 단순한 사건이 아니라 ${data.why}에 대한 서운함이 축적된 결과입니다.`,
          step1: `1단계 - 차분한 냉각기: ${data.when} 발생한 갈등 직후이므로, 바로 연락하기보다는 감정이 가라앉을 시간을 최소 하루 이상 확보하세요.`,
          step2: `2단계 - 핵심 포인트 정리: '${data.how}' 과정에서 상대가 상처받았을 부분과 나의 본래 의도를 구분해 적어보세요.`,
          step3: `3단계 - 1:1 대화 요청: ${data.where}와 같이 공개된 곳보다는 둘만의 조용한 공간에서 감정적 비난 없이 진솔한 대화를 시도하세요.`,
          step4: `4단계 - 재발 방지 약속: 약속 시간이나 소통 방식 등 이번 문제의 원인이 된 기준을 명확히 정해두는 것으로 마무리하세요.`,
          risks: `상대방의 성별(${data.otherGender})이나 관계 단계를 무시하고 메신저로 긴 장문의 비난을 보내거나, 3자를 끌어들여 잘못을 따지는 행동은 갈등을 걷잡을 수 없이 크게 만듭니다.`
        });
      }, 1000);
    }

    function renderResults(res) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('solution-content').classList.remove('hidden');

      document.getElementById('res-summary').innerText = res.summary;
      document.getElementById('res-risks').innerText = res.risks;

      const stepsContainer = document.getElementById('res-steps');
      stepsContainer.innerHTML = '';
      [res.step1, res.step2, res.step3, res.step4].forEach((s, idx) => {
        if (!s) return;
        const div = document.createElement('div');
        div.className = 'p-4 bg-white border border-slate-200 rounded-2xl shadow-sm flex items-start gap-3';
        div.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 font-bold flex items-center justify-center text-xs shrink-0 mt-0.5">${idx + 1}</div>
          <div class="text-sm text-slate-800 leading-relaxed">${s}</div>
        `;
        stepsContainer.appendChild(div);
      });
    }

    function copyResults() {
      const text = `${document.getElementById('res-summary').innerText}\n\n[대처 솔루션]\n${document.getElementById('res-steps').innerText}\n\n[주의사항]\n${document.getElementById('res-risks').innerText}`;
      navigator.clipboard.writeText(text);
      alert('솔루션 내용이 클립보드에 복사되었습니다.');
    }

    function resetAll() {
      goToStep(1);
    }
  </script>
</body>
</html>
